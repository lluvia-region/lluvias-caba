name: Carga histórica

on:
  workflow_dispatch:
    inputs:
      desde:
        description: "Fecha inicial (AAAA-MM-DD)"
        required: true
        default: "2025-10-01"
      hasta:
        description: "Fecha final (AAAA-MM-DD). Vacío = ayer"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  cargar:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar el período pedido
        env:
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
        run: |
          if [ -n "$HASTA" ]; then
            python -m lluvias historico --desde "$DESDE" --hasta "$HASTA"
          else
            python -m lluvias historico --desde "$DESDE"
          fi

      - name: Guardar cambios en el repositorio
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/datos.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Carga histórica ${{ inputs.desde }} a ${{ inputs.hasta || 'ayer' }}"
            git pull --rebase
            git push
          fi
